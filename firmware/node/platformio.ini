; PlantPulse node firmware - ESP32-S3-DevKitC-1
[env:esp32-s3-devkitc-1]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -DARDUINO_USB_CDC_ON_BOOT=1 -DPP_POD_ID=1
build_unflags = -std=gnu++11
lib_deps =
    adafruit/Adafruit SHT4x Library@^1.0.4
    sparkfun/SparkFun SCD30 Arduino Library@^1.0.20
    adafruit/Adafruit AS7341@^1.3.4
    adafruit/Adafruit NAU7802 Library@^1.0.4
    adafruit/Adafruit INA228 Library@^1.0.1
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    waspinator/AccelStepper@^1.64
