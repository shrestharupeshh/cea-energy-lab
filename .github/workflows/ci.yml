name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dashboard,dev]"
      - run: make -C firmware/node/test_host test
      - run: pytest
      - run: python simulation/run_virtual_study.py --quick
